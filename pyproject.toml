[project]
name = "syntheon-poel-core"
version = "0.1.0"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "structlog>=24.1.0"
]

[project.scripts]
poel = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poel"]

[tool.hatch.build.targets.wheel.force-include]
"src/main.py" = "main.py"
